name: CI

# Depoda 233 test vardi ama hicbir sey calistirmiyordu. Bu is akisi her
# push ve pull request'te tip kontrolu, testler ve production build'i
# calistirir.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Bagimliliklari kur
        run: npm ci

      - name: Tip kontrolu
        run: npm run typecheck

      - name: Testler
        run: npm test

      - name: Production build
        run: npm run build
